[project]
name = "airgap-assistant"
version = "0.1.0"
description = "Offline LLM-Based Intelligent Conversational Assistant for Secure Air-Gapped Networks"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "qdrant-client>=1.12",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44",
    "psutil>=6.1",
    "python-multipart>=0.0.20",
]

# Dev tools (pytest, ruff, mypy) are pinned in environment.yml / conda-lock.yml.

[project.scripts]
airgap-server = "app.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "api", "rag", "ingest", "auth", "attestation", "db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PTH", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
packages = ["app", "api", "rag", "ingest", "auth", "attestation", "db", "tests"]
